pluginManagement {
    repositories {
        google()
        // Google's GCS mirror of Maven Central — far less aggressive 429 rate limiting.
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }
        mavenCentral()
    }
}

rootProject.name = "DorkRunner"
include(":app")
